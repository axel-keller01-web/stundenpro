<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>StundenPro</title>
<style>
body{font-family:-apple-system,Arial;background:#f3f5f9;margin:0;padding:18px;color:#172033}
main{max-width:750px;margin:auto}h1{margin-bottom:5px}
.card{background:white;padding:18px;border-radius:16px;margin:15px 0;box-shadow:0 2px 10px #0001}
input,select,button{box-sizing:border-box;width:100%;padding:14px;margin:6px 0;border-radius:10px;font-size:17px;border:1px solid #ddd}
button{background:#172033;color:white;font-weight:bold;border:0}
.item{padding:12px 0;border-bottom:1px solid #eee}
small{color:#687386}
</style>
</head>
<body><main>
<h1>⏱ StundenPro</h1>
<p>Meine Kunden und Arbeitsstunden</p>
<div class="card">
<h2>Kunde anlegen</h2>
<input id="name" placeholder="Kundenname">
<input id="rate" type="number" step="0.01" placeholder="Stundenlohn in Euro">
<button onclick="addCustomer()">Kunde speichern</button>
</div>
<div class="card">
<h2>Stunden erfassen</h2>
<select id="customer"></select>
<input id="date" type="date">
<input id="hours" type="number" step="0.25" placeholder="Arbeitsstunden">
<input id="note" placeholder="Beschreibung">
<button onclick="addTime()">Stunden speichern</button>
</div>
<div class="card"><h2>Übersicht</h2><div id="summary"></div></div>
<div class="card"><h2>Kunden</h2><div id="customers"></div></div>
<div class="card"><h2>Zeiteinträge</h2><div id="entries"></div></div>
</main>
<script>
const key="stundenpro-v1";
let data;
try{data=JSON.parse(localStorage.getItem(key))||{customers:[],entries:[]}}catch(e){data={customers:[],entries:[]}}
const euro=n=>new Intl.NumberFormat("de-DE",{style:"currency",currency:"EUR"}).format(n);
const safe=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
document.getElementById("date").value=new Date().toLocaleDateString("en-CA");
function save(){localStorage.setItem(key,JSON.stringify(data));render()}
function addCustomer(){
const n=document.getElementById("name").value.trim(),r=Number(document.getElementById("rate").value);
if(!n||!document.getElementById("rate").value||!Number.isFinite(r)||r<0)return alert("Bitte Kundenname und Stundenlohn eingeben.");
data.customers.push({id:Date.now().toString()+Math.random(),name:n,rate:r});
document.getElementById("name").value="";document.getElementById("rate").value="";save()}
function addTime(){
const id=document.getElementById("customer").value,c=data.customers.find(x=>x.id===id),h=Number(document.getElementById("hours").value),d=document.getElementById("date").value;
if(!c||!d||!Number.isFinite(h)||h<=0)return alert("Bitte Kunde, Datum und Stunden eingeben.");
data.entries.push({id:Date.now().toString()+Math.random(),customerId:id,date:d,hours:h,rate:c.rate,note:document.getElementById("note").value});
document.getElementById("hours").value="";document.getElementById("note").value="";save()}
function render(){
document.getElementById("customer").innerHTML=data.customers.map(c=>'<option value="'+c.id+'">'+safe(c.name)+'</option>').join("");
document.getElementById("customers").innerHTML=data.customers.map(c=>'<div class="item">'+safe(c.name)+' – '+euro(c.rate)+'/h</div>').join("")||"Noch keine Kunden";
document.getElementById("entries").innerHTML=data.entries.slice().reverse().map(e=>{let c=data.customers.find(x=>x.id===e.customerId);return '<div class="item"><b>'+safe(c?.name||"Unbekannt")+'</b><br><small>'+safe(e.date)+' · '+e.hours+' h · '+safe(e.note)+'</small><br>'+euro(e.hours*e.rate)+'</div>'}).join("")||"Noch keine Einträge";
let h=data.entries.reduce((s,e)=>s+e.hours,0),r=data.entries.reduce((s,e)=>s+e.hours*e.rate,0);
document.getElementById("summary").textContent=h.toFixed(2).replace(".",",")+" Stunden · "+euro(r);
}
render();
</script></body></html>
